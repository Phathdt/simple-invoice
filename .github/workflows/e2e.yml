name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Cucumber + Playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simple-invoice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simple-invoice"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/simple-invoice?schema=public
      JWT_SECRET: ci-e2e-secret
      JWT_EXPIRES_IN: '3600'
      PORT: '4000'
      NODE_ENV: test
      LOG_LEVEL: info
      APP_URL: http://localhost:5173
      API_URL: http://localhost:4000
      VITE_API_BASE_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Apply migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Seed database
        run: pnpm seed

      - name: Install Playwright browser
        run: pnpm --filter e2e install:browsers

      - name: Build backend
        run: pnpm --filter backend build

      - name: Start backend
        run: pnpm --filter backend start &

      - name: Start frontend
        run: pnpm --filter frontend dev --host &

      - name: Wait for servers
        run: |
          npx --yes wait-on http://localhost:4000/health http://localhost:5173 --timeout 120000

      - name: Run e2e tests
        run: pnpm --filter e2e test

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/e2e/test-results/
          if-no-files-found: ignore
