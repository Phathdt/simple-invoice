services:
  postgres:
    image: postgres:16-alpine
    container_name: simple-invoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple-invoice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple-invoice"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: simple-invoice-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Load secrets/config from the backend's own .env (JWT_SECRET, JWT_EXPIRES_IN, ...).
    env_file:
      - apps/backend/.env
    # Overrides for the container context (take precedence over env_file).
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/simple-invoice
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: simple-invoice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
