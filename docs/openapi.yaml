openapi: 3.0.0
paths:
  /auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User registered, JWT returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionDataResponse'
        '409':
          description: Email already registered
      summary: Register new user
      tags:
        - auth
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '201':
          description: JWT returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionDataResponse'
        '401':
          description: Invalid credentials
      summary: Login with email/password
      tags:
        - auth
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataResponse'
        '401':
          description: Unauthorized
      security:
        - bearer: []
      summary: Get current user profile
      tags:
        - auth
info:
  title: SimpleInvoice API
  description: SimpleInvoice REST API
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        email:
          type: string
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
        password:
          type: string
          minLength: 6
      required:
        - fullName
        - email
        - password
    AuthSessionDataResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
            user:
              type: object
              properties:
                id:
                  type: string
                fullName:
                  type: string
                email:
                  type: string
                createdAt:
                  type: string
              required:
                - id
                - fullName
                - email
                - createdAt
          required:
            - token
            - user
      required:
        - data
    LoginInput:
      type: object
      properties:
        email:
          type: string
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
        password:
          type: string
          minLength: 6
      required:
        - email
        - password
    UserDataResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            fullName:
              type: string
            email:
              type: string
            createdAt:
              type: string
          required:
            - id
            - fullName
            - email
            - createdAt
      required:
        - data
